server {
    # 监听端口（FRP转发过来的端口，或者是服务器对外端口）
    listen 80;
    
    # 你的域名
    server_name your-domain.com;

    # --- 1. 前端静态资源 ---
    # 访问域名根目录时，返回 React 编译好的 dist 文件
    location / {
        # 注意：这里要改成你服务器上实际的 dist 路径
        root /home/ubuntu/lab-meeting-app/frontend/dist;
        index index.html;
        
        # 核心：支持 React 路由刷新（SPA 必备）
        # 如果找不到文件，就返回 index.html，交给 React 处理路由
        try_files $uri $uri/ /index.html;
    }

    # --- 2. 后端接口转发 ---
    # 访问 /api 开头时，转发给 Python 后端
    location /api/ {
        # 转发给本地运行的 FastAPI (Uvicorn)
        proxy_pass http://127.0.0.1:8000;

        # 标准代理头设置（让后端知道真实的客户端IP）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}